<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - কারিগরি ত্রুটি</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-title: #0f172a;
            --text-body: #64748b;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
            --accent-orange: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg);
            /* Minimalist Tech Dot Grid */
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-title);
        }

        /* Minimal Card Container */
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 55px 45px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.06), 0 0 1px 1px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Top Status Indicator */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-red);
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
            animation: pulse-ring 1.8s infinite;
        }

        /* Glitch Effect on 404 */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }

        .glitch {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 96px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-title);
            position: relative;
            letter-spacing: -2px;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-red);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--accent-blue);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        /* Heading & Text */
        .title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-title);
            margin-bottom: 12px;
        }

        .desc {
            font-size: 16.5px;
            line-height: 1.7;
            color: var(--text-body);
            margin-bottom: 35px;
        }

        /* Minimalist Infographic Elements */
        .infographic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 35px;
            text-align: left;
        }

        .info-pill {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }

        .info-pill-title {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-body);
        }

        .info-pill-val {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .val-fixing {
            color: var(--accent-orange);
        }
        
        .val-pending {
            color: var(--accent-blue);
        }

        .mini-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #fed7aa;
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Progress Trace Line */
        .progress-track {
            height: 4px;
            width: 100%;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 35px;
        }

        .progress-bar {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-orange), var(--accent-blue));
            animation: flow 2s infinite ease-in-out;
        }

        /* Signature Section */
        .signature-wrap {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 22px;
        }

        .sign-box {
            text-align: right;
        }

        .sign-role {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sign-name {
            font-size: 21px;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: -0.5px;
            position: relative;
            display: inline-block;
        }

        .sign-name::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-title);
            transform: scaleX(0.4);
            transform-origin: right;
            transition: transform 0.3s;
        }

        .error-card:hover .sign-name::after {
            transform: scaleX(1);
        }

        /* Glitch Keyframes */
        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(60px, 9999px, 75px, 0); }
            40% { clip: rect(10px, 9999px, 85px, 0); }
            60% { clip: rect(40px, 9999px, 30px, 0); }
            80% { clip: rect(70px, 9999px, 90px, 0); }
            100% { clip: rect(25px, 9999px, 50px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(75px, 9999px, 95px, 0); }
            25% { clip: rect(15px, 9999px, 40px, 0); }
            50% { clip: rect(55px, 9999px, 20px, 0); }
            75% { clip: rect(85px, 9999px, 60px, 0); }
            100% { clip: rect(35px, 9999px, 70px, 0); }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <main class="error-card">
        
        <!-- Live Alert Badge -->
        <div class="live-badge">
            <span class="pulse-dot"></span>
            সিস্টেম রক্ষণাবেক্ষণ সক্রিয়
        </div>

        <!-- Glitch 404 -->
        <div class="glitch-wrapper">
            <div class="glitch" data-text="404">404</div>
        </div>

        <!-- Main Heading -->
        <h1 class="title">কারিগরি ত্রুটি</h1>

        <!-- Problem Statement -->
        <p class="desc">
            অনেকের পেমেন্ট লেটে যাচ্ছে, এবং ভেরিফাইতে সমস্যা হচ্ছে। <br>
            আমাদের টিম কাজ করছে, <strong>তাই এটি দ্রুত ঠিক করা হচ্ছে!</strong>
        </p>

        <!-- Infographic Tracking Cards -->
        <div class="infographic-grid">
            <div class="info-pill">
                <span class="info-pill-title">পেমেন্ট সিস্টেম</span>
                <span class="info-pill-val val-fixing">
                    <span class="mini-spinner"></span> ফিক্সিং চলছে
                </span>
            </div>
            <div class="info-pill">
                <span class="info-pill-title">ভেরিফিকেশন গেটওয়ে</span>
                <span class="info-pill-val val-pending">
                    রি-সিঙ্ক করা হচ্ছে
                </span>
            </div>
        </div>

        <!-- Minimal Progress Bar Trace -->
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>

        <!-- Signature -->
        <div class="signature-wrap">
            <div class="sign-box">
                <div class="sign-role">কর্তৃপক্ষ</div>
                <div class="sign-name">দিগন্ত সাহেব</div>
            </div>
        </div>

    </main>

</body>
</html>
