{% extends "layout.html" %}
{% block content %}

<!-- ThumbmarkJS for Device Fingerprinting (Security) -->
<script src="https://cdn.jsdelivr.net/npm/@thumbmarkjs/thumbmarkjs/dist/thumbmark.umd.js"></script>

<style>
    /* ==========================================
       EARN DAILY - MODERN SOFT LIGHT REGISTER UI
    ========================================== */
    .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* Auth Card */
    .auth-card {
        background: #FFFFFF;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 32px;
        box-shadow: 0 20px 45px -10px rgba(16, 185, 129, 0.08), 0 4px 12px rgba(15, 23, 42, 0.02);
        position: relative;
        overflow: hidden;
    }
    
    /* Modern Input */
    .input-group { position: relative; margin-bottom: 16px; }
    .light-input {
        width: 100%; background: #F8FAFC; border: 1px solid #E2E8F0;
        color: #0F172A; padding: 15px 16px 15px 46px; border-radius: 18px;
        font-size: 13.5px; outline: none; transition: all 0.25s ease;
        appearance: none;
    }
    .light-input:focus { 
        border-color: #10B981; 
        background: #FFFFFF; 
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); 
    }
    .light-input::placeholder { color: #94A3B8; }
    
    .light-input.error-border { 
        border-color: #F43F5E !important; 
        background: #FFF1F2 !important; 
    }
    
    .input-icon { 
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%); 
        color: #94A3B8; font-size: 14px; transition: color 0.25s ease; 
    }
    .light-input:focus ~ .input-icon { color: #059669; }

    /* Button */
    .btn-emerald {
        background: linear-gradient(135deg, #059669 0%, #10B981 100%);
        color: #FFFFFF; width: 100%; padding: 16px;
        border-radius: 18px; font-weight: 800; font-size: 13.5px;
        letter-spacing: 0.3px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    .btn-emerald:hover {
        box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.5);
        transform: translateY(-2px);
    }
    .btn-emerald:active { transform: scale(0.96); }
</style>

<div class="flex flex-col items-center justify-center min-h-[85vh] py-6 px-2">
    
    <div class="w-full max-w-sm auth-card p-8 sm:p-10 fade-in-up">

        <!-- Header -->
        <div class="mb-6 text-center">
            <div class="h-14 w-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white text-2xl mx-auto mb-3.5 shadow-lg shadow-emerald-500/25">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight mb-1">একাউন্ট তৈরি করুন</h2>
            <p class="text-xs text-slate-500 font-medium"><b class="text-emerald-600 font-bold">Earn Daily</b> নেটওয়ার্কে যোগ দিন</p>
        </div>

        <!-- Security Warning Pill -->
        <div class="bg-emerald-50/80 border border-emerald-100 p-3 mb-6 rounded-2xl text-center">
            <p class="text-[10px] text-emerald-800 font-bold leading-tight uppercase tracking-wider">
                <i class="fa-solid fa-shield-halved text-emerald-600 mr-1"></i> ১টি ডিভাইসে ১টির বেশি একাউন্ট নিষিদ্ধ
            </p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" method="POST" action="/register">
            
            <input type="hidden" name="ref_code" value="{{ ref_code if ref_code else '' }}">
            <input type="hidden" name="device_id" id="deviceIdInput" value="">

            <!-- Name -->
            <div class="input-group">
                <input type="text" name="name" required class="light-input" placeholder="Full Name">
                <i class="fa-regular fa-user input-icon"></i>
            </div>

            <!-- Phone -->
            <div class="input-group">
                <input type="tel" name="phone" id="phoneInput" required class="light-input font-mono tracking-wider" placeholder="017XXXXXXXX">
                <i class="fa-solid fa-mobile-screen input-icon"></i>
                <p class="text-[10px] font-bold text-rose-500 mt-1 hidden" id="phoneError">সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন</p>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input type="email" name="email" id="emailInput" required class="light-input font-mono" placeholder="yourmail@gmail.com">
                <i class="fa-brands fa-google input-icon"></i>
                <p class="text-[10px] font-bold text-rose-500 mt-1 hidden" id="emailError">শুধুমাত্র @gmail.com গ্রহণযোগ্য</p>
            </div>
            
            <!-- Password -->
            <div class="input-group !mb-0">
                <input type="password" name="password" required minlength="6" class="light-input font-mono tracking-wider" placeholder="Password (Min 6 chars)">
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-emerald">
                <span>রেজিস্ট্রেশন সম্পূর্ণ করুন</span> <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer / Login Link -->
        <div class="mt-7 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs font-medium text-slate-500">
                ইতিমধ্যে একাউন্ট আছে? 
                <a href="/login" class="text-emerald-600 font-extrabold hover:underline ml-1">লগইন করুন</a>
            </p>
        </div>

    </div>
</div>

<script>
    // Live Input Validation (Only for Email & Phone)
    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    emailInput.addEventListener('input', function() {
        if(this.value.length > 0 && !this.value.endsWith('@gmail.com')) {
            emailError.classList.remove('hidden');
            this.classList.add('error-border');
        } else {
            emailError.classList.add('hidden');
            this.classList.remove('error-border');
        }
    });

    const phoneInput = document.getElementById('phoneInput');
    const phoneError = document.getElementById('phoneError');
    phoneInput.addEventListener('input', function() {
        const regex = /^01[3-9][0-9]{8}$/;
        if(this.value.length > 0 && !regex.test(this.value)) {
            phoneError.classList.remove('hidden');
            this.classList.add('error-border');
        } else {
            phoneError.classList.add('hidden');
            this.classList.remove('error-border');
        }
    });

    // ThumbmarkJS Submit (Device Tracking)
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        // Disable button with feedback
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> <span class="ml-2">যাচাই করা হচ্ছে...</span>';
        btn.classList.add('opacity-80', 'cursor-not-allowed');

        // Get Device Fingerprint & Submit
        ThumbmarkJS.getFingerprint().then(function(fp) {
            document.getElementById('deviceIdInput').value = fp;
            document.getElementById('registerForm').submit();
        }).catch(function(err) {
            document.getElementById('registerForm').submit();
        });
    });
</script>
{% endblock %}
