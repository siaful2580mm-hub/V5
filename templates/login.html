{% extends "layout.html" %}
{% block content %}

<style>
    /* ==========================================
       EARN DAILY - MODERN SOFT LIGHT AUTH UI
    ========================================== */
    .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* Modern Light Card with Soft Emerald Shadow */
    .auth-card {
        background: #FFFFFF;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 32px;
        box-shadow: 0 20px 45px -10px rgba(16, 185, 129, 0.08), 0 4px 12px rgba(15, 23, 42, 0.02);
        position: relative;
        overflow: hidden;
    }
    
    /* Clean Input Field */
    .input-group { position: relative; margin-bottom: 20px; }
    .light-input {
        width: 100%; background: #F8FAFC; border: 1px solid #E2E8F0;
        color: #0F172A; padding: 16px 16px 16px 46px; border-radius: 18px;
        font-size: 14px; outline: none; transition: all 0.25s ease;
    }
    .light-input:focus { 
        border-color: #10B981; 
        background: #FFFFFF; 
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); 
    }
    .light-input::placeholder { color: #94A3B8; }
    
    .input-icon { 
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%); 
        color: #94A3B8; font-size: 15px; transition: color 0.25s ease; 
    }
    .light-input:focus ~ .input-icon { color: #059669; }

    /* Primary Emerald Gradient Button */
    .btn-emerald {
        background: linear-gradient(135deg, #059669 0%, #10B981 100%);
        color: #FFFFFF; width: 100%; padding: 16px;
        border-radius: 18px; font-weight: 800; font-size: 14px;
        letter-spacing: 0.3px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    .btn-emerald:hover {
        box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.5);
        transform: translateY(-2px);
    }
    .btn-emerald:active { transform: scale(0.96); }
</style>

<div class="flex flex-col items-center justify-center min-h-[80vh] py-6 px-2">
    
    <div class="w-full max-w-sm auth-card p-8 sm:p-10 fade-in-up">
        
        <!-- Header -->
        <div class="mb-8 text-center">
            <div class="h-14 w-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg shadow-emerald-500/25">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight mb-1">স্বাগতম!</h2>
            <p class="text-xs text-slate-500 font-medium">আপনার <b class="text-emerald-600 font-bold">Earn Daily</b> একাউন্টে লগইন করুন</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="/login" id="loginForm" onsubmit="return showLoading()">
            
            <div class="input-group">
                <input type="email" name="email" required class="light-input font-mono" placeholder="Email Address">
                <i class="fa-regular fa-envelope input-icon"></i>
            </div>
            
            <div class="input-group">
                <input type="password" name="password" id="passwordInput" required class="light-input font-mono tracking-wider" placeholder="Password">
                <i class="fa-solid fa-lock input-icon"></i>
                <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition">
                    <i id="eyeIcon" class="fa-regular fa-eye-slash text-sm"></i>
                </button>
            </div>
            
            <div class="flex justify-between items-center mb-7 px-1">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" id="remember" class="accent-emerald-600 h-4 w-4 cursor-pointer rounded border-slate-300">
                    <span class="text-xs font-semibold text-slate-500 group-hover:text-slate-800 transition">Remember me</span>
                </label>
                <a href="https://t.me/paylixofficial" target="_blank" class="text-xs font-bold text-emerald-600 hover:underline transition">Forgot?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-emerald">
                <span>লগইন করুন</span> <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>
        
        <!-- Footer -->
        <div class="mt-8 text-center border-t border-slate-100 pt-5">
            <p class="text-xs font-medium text-slate-500">
                একাউন্ট নেই? 
                <a href="/register" class="text-emerald-600 font-extrabold hover:underline ml-1">নতুন একাউন্ট খুলুন</a>
            </p>
        </div>

    </div>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById('passwordInput');
        const icon = document.getElementById('eyeIcon');
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
            icon.classList.add('text-emerald-600');
        } else {
            input.type = "password";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
            icon.classList.remove('text-emerald-600');
        }
    }

    function showLoading() {
        const form = document.getElementById('loginForm');
        if(form.checkValidity()) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> <span class="ml-2">প্রসেসিং...</span>';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            return true;
        }
        return false;
    }
</script>
{% endblock %}
