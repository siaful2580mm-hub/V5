{% extends "layout.html" %}
{% block content %}

<style>
    /* ==========================================
       EARN DAILY - MODERN LUCKY SPIN UI (SOFT LIGHT)
    ========================================== */
    .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(16px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* Modern Light Card */
    .light-card {
        background: #FFFFFF; 
        border: 1px solid #E2E8F0; 
        border-radius: 32px;
        padding: 30px 20px; 
        position: relative; 
        overflow: hidden; 
        text-align: center;
        box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.03);
    }

    /* Soft Fintech Spin Wheel */
    .wheel-container {
        position: relative; width: 280px; height: 280px; margin: 0 auto;
        border-radius: 50%; padding: 8px;
        background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
        border: 2px solid #A7F3D0;
        box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.25), inset 0 2px 6px rgba(255, 255, 255, 0.8);
    }
    .wheel-border {
        position: relative; width: 100%; height: 100%; border-radius: 50%;
        border: 4px solid #FFFFFF; overflow: hidden;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
    }
    .wheel {
        width: 100%; height: 100%; border-radius: 50%;
        /* Soft Emerald & Amber Conic Segments */
        background: conic-gradient(
            #059669 0deg 60deg,    /* Emerald Dark */
            #F1F5F9 60deg 120deg,  /* Slate Light (0 Taka) */
            #10B981 120deg 180deg, /* Emerald Medium */
            #D1FAE5 180deg 240deg, /* Mint Light */
            #34D399 240deg 300deg, /* Emerald Soft */
            #FEF3C7 300deg 360deg  /* Amber Light */
        );
        transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        position: relative;
    }
    
    /* Pointer Arrow with Soft Drop Shadow */
    .pointer {
        position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
        font-size: 32px; color: #E11D48; z-index: 10;
        filter: drop-shadow(0 4px 6px rgba(225, 29, 72, 0.35));
    }

    /* Center Hub */
    .wheel-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 44px; height: 44px; background: #FFFFFF; border-radius: 50%;
        z-index: 5; border: 4px solid #059669;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Wheel Numbers Typography */
    .wheel-text { 
        position: absolute; font-weight: 900; font-size: 16px; 
        font-family: 'Plus Jakarta Sans', monospace;
    }
    .t1 { top: 15%; left: 65%; transform: rotate(30deg); color: #FFFFFF; }
    .t2 { top: 45%; right: 10%; transform: rotate(90deg); color: #475569; }
    .t3 { bottom: 15%; right: 25%; transform: rotate(150deg); color: #FFFFFF; }
    .t4 { bottom: 15%; left: 25%; transform: rotate(210deg); color: #047857; }
    .t5 { top: 45%; left: 10%; transform: rotate(270deg); color: #FFFFFF; }
    .t6 { top: 15%; left: 25%; transform: rotate(330deg); color: #B45309; }

    /* Button */
    .btn-emerald {
        background: linear-gradient(135deg, #059669 0%, #10B981 100%);
        color: #FFFFFF; width: 100%; padding: 18px;
        border-radius: 20px; font-weight: 800; font-size: 14px; text-transform: uppercase;
        letter-spacing: 0.5px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    .btn-emerald:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.5); }
    .btn-emerald:active { transform: scale(0.96); }
    .btn-emerald:disabled { 
        background: #E2E8F0 !important; color: #94A3B8 !important; 
        box-shadow: none !important; cursor: not-allowed; transform: none !important; 
    }
</style>

<div class="max-w-md mx-auto space-y-6 fade-in-up pb-10 px-1 mt-2">

    <!-- 1. HEADER -->
    <div class="flex items-center justify-between mb-4 px-2">
        <a href="/work" class="h-10 w-10 bg-white rounded-xl flex items-center justify-center text-slate-600 hover:text-emerald-600 hover:bg-emerald-50 transition border border-slate-200 shadow-sm active:scale-95">
            <i class="fa-solid fa-chevron-left text-sm"></i>
        </a>
        <h2 class="text-base font-extrabold text-slate-800 tracking-tight leading-none">লাকি স্পিন হুইল</h2>
        <div class="w-10"></div> 
    </div>

    <!-- 2. MAIN CARD -->
    <div class="light-card">
        
        <div class="mb-8 relative z-10">
            <span class="text-[10px] font-black uppercase tracking-wider text-emerald-800 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200 mb-2.5 inline-block">
                Daily Free Reward
            </span>
            <h3 class="font-black text-slate-900 text-xl tracking-tight leading-tight">
                ঘুরিয়ে নিন ভাগ্যের চাকা!
            </h3>
            <p class="text-xs text-slate-500 mt-1 font-medium leading-relaxed">
                প্রতিদিন একবার সম্পূর্ণ ফ্রিতে স্পিন করে নিশ্চিত টাকা জিতে নিন।
            </p>
        </div>

        <!-- 3. SPIN WHEEL DISPLAY -->
        <div class="wheel-container mb-8 relative z-10">
            <div class="pointer"><i class="fa-solid fa-location-dot"></i></div>
            
            <div class="wheel-border">
                <div class="wheel" id="wheel">
                    <div class="wheel-text t1">৳১০</div>
                    <div class="wheel-text t2">৳০</div>
                    <div class="wheel-text t3">৳৫</div>
                    <div class="wheel-text t4">৳১</div>
                    <div class="wheel-text t5">৳২</div>
                    <div class="wheel-text t6">৳৩</div>
                </div>
            </div>
            
            <div class="wheel-center flex items-center justify-center">
                <div class="w-2.5 h-2.5 bg-emerald-600 rounded-full"></div>
            </div>
        </div>

        <!-- 4. CONTROLS & RESULT FEEDBACK -->
        <div class="relative z-10 px-2">
            {% if can_spin %}
                <button id="spinBtn" onclick="spinWheel()" class="btn-emerald">
                    <span>স্পিন করুন</span> <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>
            {% else %}
                <button disabled class="btn-emerald">
                    <i class="fa-solid fa-lock text-sm mr-1"></i> আজকের স্পিন সম্পন্ন হয়েছে
                </button>
                <p class="text-xs text-slate-400 mt-3 font-semibold flex items-center justify-center gap-1.5">
                    <i class="fa-regular fa-clock text-emerald-600"></i> আগামীকাল আবার ফ্রি স্পিন পাবেন!
                </p>
            {% endif %}
            
            <!-- Result Feedback Box -->
            <div id="resultMsgBox" class="mt-5 p-4 rounded-2xl hidden transition-all border">
                <p id="resultMsg" class="font-extrabold text-sm"></p>
            </div>
        </div>
    </div>

</div>

<!-- Spin Logic -->
<script>
    function spinWheel() {
        const btn = document.getElementById('spinBtn');
        const wheel = document.getElementById('wheel');
        const msgBox = document.getElementById('resultMsgBox');
        const msgText = document.getElementById('resultMsg');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> <span class="ml-2">ঘুরছে...</span>';
        btn.classList.add('opacity-80');

        fetch('/spin', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                let degrees = 3600; 
                if(data.reward === 10) degrees += 330;
                else if(data.reward === 0) degrees += 270;
                else if(data.reward === 5) degrees += 210;
                else if(data.reward === 1) degrees += 150;
                else if(data.reward === 2) degrees += 90;
                else if(data.reward === 3) degrees += 30;

                wheel.style.transform = `rotate(${degrees}deg)`;

                setTimeout(() => {
                    msgBox.classList.remove('hidden');
                    if(data.reward > 0) {
                        msgBox.className = "mt-5 p-4 rounded-2xl bg-emerald-50 text-emerald-900 border border-emerald-200 text-center shadow-md shadow-emerald-500/10";
                        msgText.innerHTML = `🎉 অভিনন্দন! আপনি <b class="font-mono text-base text-emerald-700">৳${data.reward}</b> জিতে নিয়েছেন! ব্যালেন্সে যোগ হয়েছে।`;
                    } else {
                        msgBox.className = "mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200 text-slate-600 text-center";
                        msgText.innerHTML = `<span>Better Luck Next Time! আগামীকাল আবার চেষ্টা করুন।</span>`;
                    }
                    setTimeout(() => location.reload(), 2500); 
                }, 4000); 
                
            } else {
                alert(data.message);
                location.reload();
            }
        })
        .catch(err => {
            alert("Connection error. Please try again.");
            location.reload();
        });
    }
</script>

{% endblock %}
